[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "omega-rd"
version = "0.1.0"
description = "Observability-Modelled Evidence Grading for Rare Disease"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
  "pandas>=2.2",
  "scipy>=1.13",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
data = ["duckdb>=1.3", "pyarrow>=17"]
ml = ["torch>=2.4", "torch-geometric>=2.6"]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
